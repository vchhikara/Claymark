<!DOCTYPE html>
<!--
  KaTeX host page.

  Loaded from the in-APK asset loader only (https://appassets.androidplatform.net/),
  never from the network — the app holds no INTERNET permission, so every
  subresource here resolves inside the APK or fails.

  Two jobs:
    1. display math ($$…$$), which arrives as a single block; and
    2. a paragraph that contains inline math ($…$), which has to stay in one
       line box with its surrounding prose — so the whole paragraph is
       rendered here rather than splitting it across two rendering engines.

  The HTML it is handed is generated by the app from the parsed Markdown AST
  and is already escaped. Document-supplied markup never reaches this page.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  @font-face {
    font-family: 'Source Serif 4';
    src: url(fonts/source-serif-4-latin-400-normal.woff2) format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Source Serif 4';
    src: url(fonts/source-serif-4-latin-600-normal.woff2) format('woff2');
    font-weight: 600; font-style: normal; font-display: block;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    /* No horizontal page scroll, ever. Wide equations scroll inside their
       own bounded container below. */
    overflow-x: hidden;
  }
  body {
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    font-size: 18px;
    line-height: 1.4;
    color: var(--text-primary);
    -webkit-user-select: none;
    user-select: none;
  }
  #root { padding: 0; }
  .cm-display {
    overflow-x: auto;
    overflow-y: hidden;
    margin: 0;
  }
  /* Malformed TeX shows an error inline rather than breaking the page. */
  .katex-error, .cm-tex-error {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--danger);
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  function reportHeight() {
    var h = document.getElementById('root').getBoundingClientRect().height;
    if (window.ClaymarkBridge && window.ClaymarkBridge.onHeight) {
      window.ClaymarkBridge.onHeight(Math.ceil(h));
    }
  }

  // Called from Kotlin. payload = { html, display, textPrimary, danger }
  window.cmRender = function (payload) {
    try {
      var data = typeof payload === 'string' ? JSON.parse(payload) : payload;
      document.documentElement.style.setProperty('--text-primary', data.textPrimary);
      document.documentElement.style.setProperty('--danger', data.danger);

      var root = document.getElementById('root');
      root.innerHTML = data.html;

      var nodes = root.querySelectorAll('[data-tex]');
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var tex = node.getAttribute('data-tex');
        var isDisplay = node.getAttribute('data-display') === 'true';
        try {
          katex.render(tex, node, {
            displayMode: isDisplay,
            throwOnError: false,
            output: 'htmlAndMathml'
          });
        } catch (err) {
          // rehype-katex's contract: a malformed expression degrades within
          // its own node and never throws to the caller.
          node.className = 'cm-tex-error';
          node.textContent = tex;
        }
      }

      // Fonts settle after layout; measure once they have.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          reportHeight();
          setTimeout(reportHeight, 50);
        });
      } else {
        reportHeight();
      }
      setTimeout(reportHeight, 0);
    } catch (e) {
      if (window.ClaymarkBridge && window.ClaymarkBridge.onError) {
        window.ClaymarkBridge.onError(String(e));
      }
    }
  };

  window.addEventListener('resize', reportHeight);
</script>
</body>
</html>
